version: "3"

services:
  front-end:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

  back-end:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "80:80"
