version: "3.8"

services:
  front-end:
    build:
      context: ./frontend
    command: npm run dev
    volumes:
      - ./frontend/src:/app/src
    networks:
      - dev-networks

  back-end:
    build:
      context: ./backend
    networks:
      - dev-networks

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    depends_on:
      - front-end
      - back-end
    networks:
      - dev-networks

networks:
  dev-networks:
    driver: bridge
